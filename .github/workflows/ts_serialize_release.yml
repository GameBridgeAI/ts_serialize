name: release

on:
  push:
    tags: ["v*.*.*"]

# OIDC setup for trusted publishing
permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        deno: ["v2.x"]
        os: [macOS-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Setup repo
        uses: actions/checkout@v2

      - name: Setup Deno
        uses: denolib/setup-deno@v2
        with:
          deno-version: ${{ matrix.deno }}

      - name: Deno lint
        run: deno task lint

      - name: Deno format check
        run: deno task fmt --check
        if: matrix.os != 'windows-latest'

      - name: Run deno tests
        run: deno task test

  build:
    name: Release
    runs-on: ubuntu-latest
    needs: test

    strategy:
      matrix:
        deno: ["v2.x"]

    steps:
      - name: Get github tag
        id: get_github_tag
        run: echo ::set-output name=VERSION::${GITHUB_REF#refs/tags/}

      - name: Setup repo
        uses: actions/checkout@v2

      - name: Setup deno
        uses: denolib/setup-deno@v2
        with:
          deno-version: ${{ matrix.deno }}

      - name: Setup node
        uses: actions/setup-node@v1
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Build and test NPM module
        run: deno task build -v ${{ steps.get_github_tag.outputs.VERSION }}

      - name: Create release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false

      - name: Update npm to 11.5.1 or later for trusted publishing
        run: npm install -g npm@latest

      - name: Deploy to NPM
        run: |
          cd dist
          npm publish --access public
